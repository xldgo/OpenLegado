[package]
name = "legado-db"
version = "0.2.0"
edition.workspace = true

[dependencies]
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
legado-core = { path = "../legado-core" }
log = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
chrono = "0.4"

# 音色稳定标识与上游 SpeechIdentity 一致，复用锁定的 SHA-256 crate。
sha2 = "0.11"
