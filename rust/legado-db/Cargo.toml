[package]
name = "legado-db"
version = "0.2.0"
edition.workspace = true

[dependencies]
# 保留系统随机盐策略，不启用新库内部的另一条随机数生成路径。
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
rand_core = { workspace = true, features = ["getrandom"] }
legado-core = { path = "../legado-core" }
log = { workspace = true }
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true, default-features = true }

# 音色稳定标识与上游 SpeechIdentity 一致，复用锁定的 SHA-256 crate。
sha2 = { workspace = true }
