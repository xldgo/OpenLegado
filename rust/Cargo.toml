[workspace]
resolver = "3"
members = [
    "legado-layout",
    "legado-core",
    "legado-parser",
    "legado-net",
    "legado-js",
    "legado-book",
    "legado-db",
    "legado-engine",
    "legado-fetcher",
    "legado-ffi",
    "legado-server",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
md-5 = "0.11"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = "1"
thiserror = "2"
aes = "0.9"
cbc = "0.2"
ecb = "0.2"
des = "0.9"
base64 = "0.23"
regex = "1"
