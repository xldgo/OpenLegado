[workspace]
resolver = "3"
members = [
    "legado-layout",
    "legado-core",
    "legado-parser",
    "legado-net",
    "legado-js",
    "legado-book",
    "legado-db",
    "legado-engine",
    "legado-fetcher",
    "legado-ffi",
    "legado-server",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# 共用依赖在此维护版本、共有功能与构建策略；各 crate 保留差异功能、optional 与平台条件。
# 实际解析版本由 Cargo.lock 锁定；仅局部使用或不兼容的版本可留在所属 crate。

# 序列化、日志与错误处理
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 异步运行时与并发
futures = "0.3"
tokio = "1"

# 网络请求与地址处理
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2", "charset"] }
url = "2"
urlencoding = "2.1"

# 文本解析与脚本
encoding_rs = "0.8"
jsonpath-rust = "0.7"
quick-xml = "0.42"
regex = "1"
rquickjs = "0.14"
scraper = "0.29"

# 加密、摘要与编解码
aes = "0.9"
base64 = "0.23"
cbc = "0.2"
des = "0.9"
ecb = "0.2"
md-5 = "0.11"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11"

# 数据库与缓存
lru = "0.19"
r2d2 = "0.8"
r2d2_sqlite = "0.35"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# 压缩与归档
flate2 = "1"
zip = "9.0.1"
ring = "0.17.14"

# 时间与标识
chrono = { version = "0.4", default-features = false }
uuid = { version = "1", features = ["v4"] }

# 内部模块（路径以工作区根目录为基准）
legado-book = { path = "legado-book" }
legado-core = { path = "legado-core" }
legado-db = { path = "legado-db" }
legado-engine = { path = "legado-engine" }
legado-fetcher = { path = "legado-fetcher" }
legado-js = { path = "legado-js" }
legado-layout = { path = "legado-layout" }
legado-net = { path = "legado-net" }
legado-parser = { path = "legado-parser" }

# 开发及默认测试保留堆栈文件名和行号，减少类型与变量调试信息的磁盘占用。
[profile.dev]
debug = "line-tables-only"

# 发布档只显式声明非默认项：opt-level = 3、panic = "unwind"、codegen-units = 16
# 都是 Cargo 的 release 默认值，不重复写。
#
# 只开 thin LTO：跨 crate 内联与死代码消除，链接耗时远小于 fat，收益接近。
#
# 不设 strip：Windows 产物没有可剥的符号（PE 符号在 PDB 里，release 默认
# debug = 0 不生成 PDB）；iOS 产物是 staticlib，rustc 的 strip 只在链接阶段
# 生效、对归档无效；Android 已由 scripts/tooling/android.py 用 NDK llvm-strip
# 处理，且工具链契约要求"只剥打包副本"（sourceSha256 与 packagedSha256 必须
# 不同），在 profile 层面剥会破坏该不变量。
#
# 不设 codegen-units：与 thin LTO 同开会削弱其跨模块并行导入，收益仅个位数
# 百分比，待单独实测增量后再定。
#
# 不设 panic = "abort"：生产代码有 3 处 catch_unwind 依赖 unwind 做失败隔离
# （legado-engine 的 source_batches / cache_downloads），改为 abort 会让单源
# 搜索崩溃升级为整个应用退出；且 iOS 不允许进程隔离，没有兜底方案。
#
# 不改 opt-level：正文排版、书源规则解析、QuickJS 执行是 CPU 密集路径，降到
# "s"/"z" 还会连带把 C 依赖（rquickjs-sys / libsqlite3-sys / ring）压到
# -Os/-Oz，得不偿失。
[profile.release]
lto = "thin"
