[package]
name = "legado-engine"
version = "0.2.0"
edition.workspace = true

[dependencies]
futures = { workspace = true }
legado-book = { path = "../legado-book" }
legado-parser = { path = "../legado-parser" }
legado-core = { path = "../legado-core" }
legado-db = { path = "../legado-db" }
legado-fetcher = { path = "../legado-fetcher" }
legado-net = { path = "../legado-net" }
legado-js = { path = "../legado-js" }
log = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
rusqlite = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }

[features]
default = []
quickjs = ["legado-fetcher/quickjs"]
