[package]
name = "legado-net"
version = "0.2.0"
edition.workspace = true

[dependencies]
legado-core = { path = "../legado-core" }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
# gzip/brotli/deflate：对齐上游 OkHttp 透明解压缩（reqwest 自动设置 Accept-Encoding 并解压）
# socks：支持 SOCKS5 代理（含 user:pass 凭据，对齐上游 Socks5Proxy.kt）
reqwest = { workspace = true, features = ["json", "cookies", "rustls-no-provider", "http2", "charset", "gzip", "brotli", "deflate", "socks", "stream"] }
# 保留升级前的 ring 与 Mozilla 根证书，避免 Android FFI 依赖额外的 JVM 证书接线。
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
webpki-root-certs = "1.0.11"
url = { workspace = true }
regex = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
quick-xml = { workspace = true }
urlencoding = { workspace = true }
async-trait = "0.1"
futures-core = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
filetime = "0.2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# 测试用：构造 gzip 压缩响应体
flate2 = { workspace = true }
# 本地 HTTPS 回归：运行时生成测试证书，不依赖外网或固定私钥。
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
