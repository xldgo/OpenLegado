[package]
name = "legado-book"
version = "0.2.0"
edition.workspace = true

[dependencies]
legado-core = { path = "../legado-core" }
serde = { workspace = true }
serde_json = { workspace = true }
zip = "9.0.1"
quick-xml = "0.42"
encoding_rs = "0.8"
regex = "1"
lopdf = "0.45"
# PDF 导出：纯 Rust 实现（printpdf + rusttype），支持 Android 交叉编译
# images feature：启用 genpdf 的图片嵌入能力（图片书/漫画 PDF 导出）
genpdf = { version = "0.2", features = ["images"] }
# 图片解码（JPEG/PNG）使用当前版本；旧类型只在 genpdf 接口处接收已解码像素。
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
image_pdf = { package = "image", version = "0.23", default-features = false }

# unrar 在 Android 上无法交叉编译（unrar_sys 含 Windows 专属代码），
# iOS 与 Android 同策略排除（对齐 Android 行为基线，免 C++ 运行时链接）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
unrar = "0.5"
