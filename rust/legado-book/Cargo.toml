[package]
name = "legado-book"
version = "0.2.0"
edition.workspace = true

[dependencies]
legado-core = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
encoding_rs = { workspace = true }
regex = { workspace = true }
lopdf = "0.46"
# 仅启用PDF文本/图片写入，不引入默认HTML/CSS与Azul排版链。
printpdf = { version = "0.12.8", default-features = false, features = ["png", "jpeg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# unrar 在 Android 上无法交叉编译（unrar_sys 含 Windows 专属代码），
# iOS 与 Android 同策略排除（对齐 Android 行为基线，免 C++ 运行时链接）
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
unrar = "0.5"
