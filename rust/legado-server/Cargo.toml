[package]
name = "legado-server"
version = "0.2.0"
edition.workspace = true

[dependencies]
legado-core = { path = "../legado-core" }
legado-db = { path = "../legado-db" }
legado-engine = { path = "../legado-engine" }
legado-net = { path = "../legado-net" }
legado-book = { path = "../legado-book" }
# MCP eval_js 工具依赖的书源 JS 引擎（quickjs 为可选透传 feature）
legado-js = { path = "../legado-js" }
# [P5-1 链 b] 书源抓取共享实现（server/ffi 单一来源；quickjs 透传见 features）
legado-fetcher = { path = "../legado-fetcher" }

axum = { version = "0.8", features = ["ws", "json"] }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-no-provider", "http2", "charset"] }
base64 = { workspace = true }
urlencoding = { workspace = true }
tower-http = { version = "0.7", features = ["cors", "fs"] }
# 静态资产开发机磁盘兜底（web_assets::serve_static 内以 ServiceExt::oneshot
# 调用 ServeDir）；tower 亦是 axum 的传递依赖与既有 dev-dependency，无新增外部 crate
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = []
# 透传 legado-js 的 quickjs feature：启用后 MCP eval_js 工具可真实执行 JS 脚本；
# 同步透传 legado-fetcher/quickjs（书源 JS 分派/loginCheckJs 真执行）
quickjs = ["legado-js/quickjs", "legado-fetcher/quickjs", "legado-engine/quickjs"]

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
