# 仓库级 Cargo 配置 intentionally 保持最小化。
#
# 本机 Android NDK 交叉编译 linker 请写入用户级配置，勿提交仓库：
#   Windows: %USERPROFILE%\.cargo\config.toml
#   Linux/macOS: ~/.cargo/config.toml
#
# 示例（路径按本机 NDK 安装调整）：
# [target.aarch64-linux-android]
# linker = ".../aarch64-linux-android21-clang"
#
# crates.io 镜像同理：仅在 CI 或开发者本机 config 中配置，避免绑定单一镜像源。

# Android Rust 库显式设置 LOAD 与 RELRO 的 16 KB 对齐；本地和 CI 共用此参数。
# 来源：https://developer.android.com/guide/practices/page-sizes
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]
