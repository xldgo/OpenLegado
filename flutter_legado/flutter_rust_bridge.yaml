# flutter_rust_bridge 代码生成配置
#
# 运行代码生成:
#   在仓库根目录运行 python scripts/dev.py generate bridge；构建原生库另行执行。

rust_input: crate::ffi,crate::layout_bridge
rust_root: ../rust/legado-ffi/
dart_output: lib/src/bridge/
dart_entrypoint_class_name: RustLib

# 依赖由锁文件管理，生成过程只更新绑定，不自动修改其他 Dart 源码。
auto_upgrade_dependency: false
dart_fix: false
stop_on_error: true
rust_features:
  - quickjs
