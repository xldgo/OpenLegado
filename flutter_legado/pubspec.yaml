name: flutter_legado
description: "Legado - A reading app powered by Rust + Flutter"
publish_to: 'none'
version: 2.0.435+436

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  # Flutter SDK 与本地化
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # 界面组件与图标
  material_ui: 1.8.0
  cupertino_ui: 1.1.4
  liquid_glass_widgets: 1.14.0
  cupertino_icons: ^2.0.0
  material_symbols_icons: ^4.2960.0

  # 主题配色
  dynamic_color: ^2.1.0
  material_color_utilities: ^0.13.0
  palette_generator_plus: ^1.0.0

  # 路由与状态管理
  go_router: 18.1.1
  flutter_riverpod: ^3.4.3

  # Rust 桥接与数据模型
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  # Mock 音色稳定 ID 与 Rust/上游共用 SHA-256 算法。
  crypto: ^3.0.7

  # 网络与内嵌网页
  http: ^1.2.0
  webview_flutter: ^4.10.0

  # 文件与持久化
  file_picker: ^13.1.0
  saf: ^2.1.2
  path_provider: ^2.0.0
  file: ^7.0.1
  archive: ^4.4.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # 图片展示、处理与缓存
  cached_network_image: ^4.0.4
  # 封面缓存使用专属缓存管理器，配合 file 管理文件系统。
  flutter_cache_manager: ^3.4.5
  image: ^4.10.2

  # 文本与 Markdown
  characters: ^1.4.1
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.0

  # 音视频与朗读
  audio_session: ^0.2.4
  audio_service: ^0.18.19
  just_audio:
    git:
      url: https://github.com/xldgo/just_audio.git
      ref: 05ad63dd8d92c057e25e7194e054745f34c4fb54
      path: just_audio
  just_audio_windows: ^0.2.3
  video_player: ^2.14.1
  # AGP 内置 Kotlin 迁移补丁，固定提交避免跟随分支变动。
  flutter_tts:
    git:
      url: https://github.com/nguyen703/flutter_tts.git
      ref: f6af434f7016c7b1f4709f4f8f421543abc08635

  # 扫码与二维码
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  # 图库二维码解码，配合 image 本地读取图片，不依赖相机。
  zxing2: ^0.2.4

  # 设备能力与系统交互
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  screen_brightness: ^2.0.0
  # 与 battery_plus 共用 dbus 0.7；1.8.1 仅调整了该传递依赖。
  wakelock_plus: ^1.8.0
  flutter_local_notifications: ^22.3.1
  app_links: ^7.2.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  battery_plus: ^7.1.2

dev_dependencies:
  # 测试与替身
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.0

  # 静态分析与代码规范
  # 架构静态门禁使用现有锁定的 Dart 分析器。
  analyzer: ^14.6.0
  flutter_lints: ^6.0.0

  # 代码生成
  # Freezed 4 支持 Dart 3.13，生成器共同约束 analyzer 14。
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

  # FRB 绑定生成器通过 Cargo 安装，版本与 runtime 保持一致，不属于 Dart 依赖。

flutter:
  generate: true
  # RustFFI 通过本地 CocoaPods pod 链接，保留现有依赖管理方式。
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    # 默认书籍封面（对标 Android res/drawable/image_cover_default.jpg）
    - assets/images/
    # 默认数据（对标 Android assets/defaultData）
    - assets/default_data/
    # Mock 书架样例（USE_MOCK 数据源，合成脱敏；口径见 assets/mock_data/README.md）
    - assets/mock_data/
    # 帮助文档（对标 Android assets/web/help/md + storageHelp.md）
    - assets/web/help/md/
    - assets/storageHelp.md
    # About 页（对标 Android assets/updateLog.md + disclaimer.md）
    - assets/updateLog.md
    - assets/disclaimer.md
