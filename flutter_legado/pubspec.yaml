name: flutter_legado
description: "Legado - A reading app powered by Rust + Flutter"
publish_to: 'none'
version: 2.0.386+387

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  cupertino_icons: ^2.0.0
  file_picker: ^13.1.0
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  # Mock 音色稳定 ID 与 Rust/上游共享 SHA-256 算法，使用已有锁定版本。
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  characters: ^1.4.1
  http: ^1.2.0
  path_provider: ^2.0.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  just_audio:
    git:
      url: https://github.com/xldgo/just_audio.git
      ref: 05ad63dd8d92c057e25e7194e054745f34c4fb54
      path: just_audio
  just_audio_windows: ^0.2.3
  video_player: ^2.14.1
  webview_flutter: ^4.10.0
  cached_network_image: ^4.0.4
  flutter_riverpod: ^3.4.3
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  # [PARITY A1] 图库二维码解码：参考版扫码页右上图库按钮，选中图片后本地
  # 解码 QR（zxing2 纯 Dart 解码器 + image 解图），不依赖相机即可导入
  zxing2: ^0.2.4
  image: ^4.10.2
  saf: ^2.1.2
  archive: ^4.4.0
  package_info_plus: ^10.2.2
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.0
  material_symbols_icons: ^4.2960.0

  # ── [iOS 轨 P2] 原生功能补齐（Android 走既有 Kotlin 桥，不回归）──
  flutter_tts: ^4.2.0
  device_info_plus: ^13.3.0
  screen_brightness: ^2.0.0
  flutter_local_notifications: ^22.3.1
  app_links: ^7.2.2
  palette_generator_plus: ^1.0.0
  dynamic_color: ^2.1.0
  material_color_utilities: ^0.13.0
  material_ui: 1.6.0
  cupertino_ui: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Freezed 4 支持 Dart 3.13，生成器共同约束 analyzer 14。
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.0
  # codegen 通过 cargo install flutter_rust_bridge_codegen 安装
  # 运行: flutter_rust_bridge_codegen generate

flutter:
  generate: true
  # RustFFI 通过本地 CocoaPods pod 链接，保留现有依赖管理方式。
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    # 默认书籍封面（对标 Android res/drawable/image_cover_default.jpg）
    - assets/images/
    # 默认数据（对标 Android assets/defaultData）
    - assets/default_data/
    # Mock 书架样例（USE_MOCK 数据源，合成脱敏；口径见 assets/mock_data/README.md）
    - assets/mock_data/
    # 帮助文档（对标 Android assets/web/help/md + storageHelp.md）
    - assets/web/help/md/
    - assets/storageHelp.md
    # About 页（对标 Android assets/updateLog.md + disclaimer.md）
    - assets/updateLog.md
    - assets/disclaimer.md
