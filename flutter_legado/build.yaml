# 嵌套 freezed 模型 toJson 必须展开为 Map，否则 JsonEncoder 导出书源会报
# Converting object to an encodable object failed（书源导出根因）
targets:
  $default:
    builders:
      # 由生成器格式化，避免新模板输出行尾空格；不手工修改生成文件。
      freezed:
        options:
          format: true
      json_serializable:
        options:
          explicit_to_json: true
