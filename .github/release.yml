changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 新功能
      labels:
        - enhancement
        - feature
    - title: 问题修复
      labels:
        - bug
        - fix
    - title: 性能改进
      labels:
        - performance
        - 'impact: performance'
    - title: 依赖更新
      labels:
        - dependencies
    - title: 重构与维护
      labels:
        - maintenance
    - title: 文档
      labels:
        - documentation
    - title: 其他变更
      labels:
        - "*"
