name: 判定 CI 改动范围
description: 运行编排回归并按事件差异选择任务；失败时不允许跳过检查。
outputs:
  flutter:
    description: 是否运行 Flutter 检查
    value: ${{ steps.changes.outputs.flutter }}
  rust:
    description: 是否运行 Rust 检查
    value: ${{ steps.changes.outputs.rust }}
  android_ffi:
    description: 是否运行 Android FFI 构建
    value: ${{ steps.changes.outputs.android_ffi }}
  windows_ffi:
    description: 是否运行 Windows FFI 冒烟
    value: ${{ steps.changes.outputs.windows_ffi }}
  ios_build:
    description: 是否构建 iOS 设备包
    value: ${{ steps.changes.outputs.ios_build }}
runs:
  using: composite
  steps:
    - name: 验证 CI 编排规则
      shell: bash
      run: python3 -m unittest discover -s .github/scripts -p test_ci_changes.py -v
    - name: 验证 Python 指纹与只读 FFI 校验
      shell: bash
      run: python3 scripts/dev.py test tooling
    - name: 判定受影响任务
      id: changes
      shell: bash
      run: python3 .github/scripts/ci_changes.py changes
