name: 判定 CI 改动范围
description: 按事件差异选择任务；失败时不允许跳过检查，工具回归集中在 Tooling CI。
inputs:
  flutter-scope:
    description: Flutter手动范围，留空沿用其它工作流的既有行为
    default: ''
  flutter-base-sha:
    description: Flutter按改动检查的基线SHA，留空比较最近一次提交
    default: ''
outputs:
  native_tests:
    description: 是否运行Linux宿主原生测试
    value: ${{ steps.changes.outputs.native_tests }}
  flutter_checks:
    description: 是否运行Flutter分析、普通测试或生成检查
    value: ${{ steps.changes.outputs.flutter_checks }}
  dart_generate:
    description: 是否复核Dart生成物
    value: ${{ steps.changes.outputs.dart_generate }}
  bridge_generate:
    description: 是否复核FRB生成物
    value: ${{ steps.changes.outputs.bridge_generate }}
  tooling:
    description: 是否运行工具回归
    value: ${{ steps.changes.outputs.tooling }}
  flutter:
    description: 是否运行 Flutter 检查
    value: ${{ steps.changes.outputs.flutter }}
  rust:
    description: 是否运行 Rust 检查
    value: ${{ steps.changes.outputs.rust }}
  ios_build:
    description: 是否构建 iOS 设备包
    value: ${{ steps.changes.outputs.ios_build }}
runs:
  using: composite
  steps:
    - name: 判定受影响任务
      id: changes
      shell: bash
      env:
        CI_FLUTTER_SCOPE: ${{ inputs.flutter-scope }}
        CI_FLUTTER_BASE_SHA: ${{ inputs.flutter-base-sha }}
      run: python3 .github/scripts/ci_changes.py changes
