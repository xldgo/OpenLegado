name: PR Code Review

on:
  pull_request:
    types: [opened, labeled, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: >-
      ${{ contains(github.event.pull_request.labels.*.name, 'review') &&
          (github.event.action != 'labeled' || github.event.label.name == 'review') &&
          !github.event.pull_request.draft &&
          github.event.pull_request.user.type != 'Bot' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    # 仅通过条件的审查作业参与并发，其他标签事件不取消进行中的审查。
    concurrency:
      group: pr-code-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Review changes with Codex
        id: codex
        uses: openai/codex-action@v1
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          openai-api-key: ${{ secrets.CODE_REVIEW_API_KEY }}
          responses-api-endpoint: ${{ secrets.CODE_REVIEW_API_ENDPOINT }}
          sandbox: read-only
          codex-args: '["--ephemeral"]'
          prompt-file: .github/codex/prompts/review.md

  publish:
    needs: review
    if: ${{ needs.review.outputs.final_message != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Publish review comment
        uses: actions/github-script@v9
        env:
          REVIEW_BODY: ${{ needs.review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- codex-pr-review -->';
            const body = `${marker}\n## Codex 自动代码审查\n\n${process.env.REVIEW_BODY}`;
            const issue_number = context.payload.pull_request.number;
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issue_number,
            });
            // 审查期间更新提交、转为草稿或移除标签后，不发布过期结果。
            if (pull.state !== 'open' || pull.draft ||
                pull.head.sha !== context.payload.pull_request.head.sha ||
                !pull.labels.some(label => label.name.toLowerCase() === 'review')) {
              core.info('PR 状态已变化，跳过本次审查评论。');
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
