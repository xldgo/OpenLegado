name: iOS Build

# 自动构建设备验收包；模拟器测试移至仅手动触发的 ios-ci.yml。
on:
  push:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      diagnostics:
        description: '启用历史图标探针及完整 car/plist 诊断上传'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios_build: ${{ steps.changes.outputs.ios_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Determine change scope
        id: changes
        uses: ./.github/actions/ci-changes

  build:
    needs: changes
    if: needs.changes.outputs.ios_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # 使用当前 macOS 镜像预装的 Xcode；Rust 与 Flutter 使用同一 SDK。
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # 缺少证书时产出未签名包；存在证书时签名失败必须使作业变红。
      # 配置入口见 docs/IOS_CI_SIGNING_SETUP.md。
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Flutter and Rust
        uses: ./.github/actions/setup-flutter-rust
        with:
          rust-targets: aarch64-apple-ios
          rust-components: llvm-tools-preview

      # rustup toolchain install --target 在镜像预装工具链上可能静默漏装目标 std，
      # 显式补装并留诊断（首跑 E0463 can not find core 根因）
      - name: Verify workspace device target
        # 在工作区内解析 rust-toolchain.toml，确认 stable 工具链具备设备目标。
        working-directory: rust
        run: |
          rustup target add aarch64-apple-ios
          rustup component add llvm-tools-preview
          rustup target list --installed

      - name: Install Flutter dependencies
        working-directory: flutter_legado
        run: flutter pub get

      # 设备静态库只使用 iphoneos SDK，最低系统版本与 App 的 15.0 对齐。
      - name: Build device Rust static library
        run: python3 scripts/dev.py build ffi ios --target device --profile release

      - name: Install device CocoaPods dependencies
        working-directory: flutter_legado/ios
        run: |
          pod install --repo-update

      - name: Build unsigned device application
        working-directory: flutter_legado
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --verbose 2>&1 | tee ios_device_build.log

      # FRB 运行时需要从设备二进制查找分发器；缺符号必须阻止交付。
      - name: Verify device PDE symbols
        run: python3 scripts/dev.py verify app ios --target device --profile release --app flutter_legado/build/ios/iphoneos/Runner.app --cargo-target-dir rust/target

      # 检查源码引用的图标文件和资产编译警告，不宣称换图标运行时已可用。
      - name: Verify icon asset references
        run: python3 scripts/dev.py verify icons ios --assets flutter_legado/ios/Runner/Assets.xcassets

      - name: Verify icon asset build warnings
        run: python3 scripts/dev.py verify icons ios --build-log flutter_legado/ios_device_build.log

      # 保留历史散文件注入和 legacy 转换；能力边界见图标问题说明。
      # docs/IOS_ICON_SWITCH_LIMITATION_20260903.md 的真机问题仍需独立复验。
      - name: Prepare and verify device icon assets
        run: python3 scripts/dev.py prepare icons ios --assets flutter_legado/ios/Runner/Assets.xcassets --app flutter_legado/build/ios/iphoneos/Runner.app

      # 直接重签最终修改版 Runner.app，保持图标兼容处理的交付结果。
      # 不使用重新 archive 的 flutter build ipa，以免覆盖上述包内修改。
      - name: Prepare device signing materials
        if: env.IOS_P12_BASE64 != ''
        working-directory: flutter_legado
        run: |
          set -euo pipefail
          WORK=build/ios/signing
          mkdir -p "$WORK"
          KEYCHAIN="$HOME/Library/Keychains/legado_ci.keychain"
          # 此步不启用 shell 跟踪，避免随机 keychain 密码写入日志。
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          # 1) P12 → 临时 keychain（并挂进 user keychain 搜索链，供 codesign 发现）
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          printf '%s' "$IOS_P12_BASE64" | base64 -d > "$WORK/legado_ci.p12"
          security import "$WORK/legado_ci.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          DEFAULT_KEYCHAIN="$(security default-keychain | awk '{print $3}')"
          security list-keychains -d user -s "$KEYCHAIN" "$DEFAULT_KEYCHAIN"
          # 2) 安装 mobileprovision 到系统目录 + 解码取 UUID / TeamID / app-identifier
          #    （entitlements 的 application-identifier 直接取自 profile 自身 → 自洽，
          #      无需单独维护 TEAM_ID secret；profile 与 bundle id 不匹配时此处即暴露）
          printf '%s' "$IOS_PROFILE_BASE64" | base64 -d > "$WORK/legado_ci.mobileprovision"
          security cms -D -i "$WORK/legado_ci.mobileprovision" > "$WORK/profile.plist"
          PROFILE_UUID="$(plutil -extract UUID raw "$WORK/profile.plist")"
          TEAM_ID="$(plutil -extract TeamIdentifier raw "$WORK/profile.plist")"
          APP_IDENTIFIER="$(plutil -extract Entitlements.application-identifier raw "$WORK/profile.plist")"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp "$WORK/legado_ci.mobileprovision" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"
          # 3) 定位 P12 中的签名身份（证书类型须与 IOS_EXPORT_METHOD 匹配：
          #    ad-hoc→Apple Distribution；development→Apple Development，
          #    见 docs/IOS_CI_SIGNING_SETUP.md）
          METHOD="${IOS_EXPORT_METHOD:-ad-hoc}"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 -oE '"[^"]+"' | tr -d '"' || true)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::P12 中无有效 codesigning 身份（export-method=$METHOD）；核对证书类型与密码，见 docs/IOS_CI_SIGNING_SETUP.md 排障小节"
            exit 1
          fi
          echo "identity: $IDENTITY"
          echo "team: $TEAM_ID / app-identifier: $APP_IDENTIFIER / method: $METHOD"
          # 4) 为待签名 app 预埋 embedded.mobileprovision + 签名 entitlements
          APP=build/ios/iphoneos/Runner.app
          cp "$WORK/legado_ci.mobileprovision" "$APP/embedded.mobileprovision"
          # 注：不用 heredoc——YAML 块标量内 heredoc 体无法缩进（terminator 须顶格），
          # 会破坏 yml 解析；改用 echo 组生成
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '  <key>application-identifier</key>'
            echo "  <string>$APP_IDENTIFIER</string>"
            echo '  <key>keychain-access-groups</key>'
            echo '  <array>'
            echo "    <string>$APP_IDENTIFIER</string>"
            echo '  </array>'
            echo '</dict>'
            echo '</plist>'
          } > "$WORK/SigningEntitlements.plist"

      - name: Sign final device application
        if: env.IOS_P12_BASE64 != ''
        working-directory: flutter_legado
        run: |
          set -euo pipefail
          WORK=build/ios/signing
          KEYCHAIN="$HOME/Library/Keychains/legado_ci.keychain"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 -oE '"[^"]+"' | tr -d '"')"
          [ -n "$IDENTITY" ] || { echo "::error::找不到 codesigning 身份"; exit 1; }
          APP=build/ios/iphoneos/Runner.app
          # 先嵌套代码对象（Flutter.framework 等），后顶层 bundle；
          # 不加 --options runtime（开发/Ad-hoc 侧载无需 hardened runtime，
          # 该选项是公证/distribution 上架路径才需要的）。
          # 不用 cd——cd 后 WORK/APP 相对路径会失效，全部用绝对化工作目录内相对路径
          for F in "$APP"/Frameworks/*.framework; do
            [ -d "$F" ] || continue
            codesign -f -s "$IDENTITY" "$F"
          done
          codesign -f -s "$IDENTITY" --entitlements "$WORK/SigningEntitlements.plist" "$APP"
          codesign -v --strict --verbose=2 "$APP"
          echo "signed Runner.app with: $IDENTITY"

      - name: Package and verify device IPA
        id: package
        run: |
          set -euo pipefail
          if [ -n "$IOS_P12_BASE64" ]; then
            IPA_NAME=app-signed.ipa
            ARTIFACT_NAME=legado-ios-signed-ipa
          else
            IPA_NAME=app-unsigned.ipa
            ARTIFACT_NAME=legado-ios-unsigned-ipa
          fi
          python3 scripts/dev.py package ios --app flutter_legado/build/ios/iphoneos/Runner.app --ipa "flutter_legado/build/ios/iphoneos/$IPA_NAME"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_path=flutter_legado/build/ios/iphoneos/$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload device IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.ipa_path }}
          retention-days: 2
          if-no-files-found: error

      - name: Note unsigned build output
        if: env.IOS_P12_BASE64 == ''
        run: echo "::warning::未配置签名证书，产出未签名 IPA；配置方法见 docs/IOS_CI_SIGNING_SETUP.md"

      - name: Upload device build failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-device-build-log
          path: flutter_legado/ios_device_build.log
          retention-days: 2
          if-no-files-found: ignore

      # car 名称扫描和大小阈值是历史启发式探针，仅显式手动诊断时运行。
      # 诊断失败不能替代上述资源、PDE、签名和 IPA 的硬校验。
      - name: Diagnose icon Assets.car name and size
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        continue-on-error: true
        run: |
          set -euo pipefail
          CAR=flutter_legado/build/ios/iphoneos/Runner.app/Assets.car
          ls -lh "$CAR"
          STR_ASCII=$(strings "$CAR" 2>/dev/null || true)
          STR_UTF16=$(strings -el "$CAR" 2>/dev/null || true)
          probe() { case "$STR_ASCII" in *"$1"*) return 0 ;; esac; case "$STR_UTF16" in *"$1"*) return 0 ;; esac; return 1; }
          if probe "AppIcon"; then
            echo "car 名称表可 grep（ASCII/UTF-16）——严格校验 6 个 appiconset 名"
            FOUND=0
            for I in 1 2 3 4 5 6; do
              N="launcher${I}"
              if probe "$N"; then FOUND=$((FOUND+1)); else echo "missing: $N"; fi
            done
            echo "appiconsets found in Assets.car: $FOUND/6"
            [ "$FOUND" -eq 6 ] || { echo "::warning::Assets.car 缺少变体图标 appiconset"; exit 1; }
          else
            echo "AppIcon 名两种编码均不可 grep——car 名称表存储方式不同，回退尺寸门禁"
            SIZE=$(wc -c < "$CAR")
            [ "$SIZE" -ge 400000 ] || { echo "::warning::Assets.car 仅 ${SIZE} 字节（全目录应 >500KB）——变体图标 appiconset 未编入"; exit 1; }
            echo "尺寸门禁通过: $SIZE 字节（此分支静态校验降级，最终权威 = 真机验收）"
          fi

      - name: Upload icon car diagnostic artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-device-assets-car
          path: flutter_legado/build/ios/iphoneos/Runner.app/Assets.car
          retention-days: 2
          if-no-files-found: ignore

      - name: Export device plist diagnostic artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        continue-on-error: true
        run: python3 scripts/dev.py export plist ios --app flutter_legado/build/ios/iphoneos/Runner.app --output-dir flutter_legado/build/ios/device-plist

      - name: Upload device plist diagnostic artifact
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-device-info-plist
          path: flutter_legado/build/ios/device-plist/
          retention-days: 2
          if-no-files-found: ignore
