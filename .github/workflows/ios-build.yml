name: iOS Build

# 自动构建设备验收包；模拟器测试移至仅手动触发的 ios-ci.yml。
on:
  push:
    paths:
      - 'flutter_legado/**'
      - 'rust/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      diagnostics:
        description: '启用历史图标探针及完整 car/plist 诊断上传'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      FLUTTER_VERSION: '3.47.7'
      # device_info_plus 13.3.0 需要 Xcode 26.1.1；Rust 与 Flutter 使用同一 SDK。
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
      # 缺少证书时产出未签名包；存在证书时签名失败必须使作业变红。
      # 配置入口见 docs/IOS_CI_SIGNING_SETUP.md。
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: 确认 Xcode 与设备 SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 安装 Rust 设备工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # rustup toolchain install --target 在镜像预装工具链上可能静默漏装目标 std，
      # 显式补装并留诊断（首跑 E0463 can not find core 根因）
      - name: 确认工作区设备目标
        # 在工作区内解析 rust-toolchain.toml，确认 stable 工具链具备设备目标。
        working-directory: rust
        run: |
          rustup target add aarch64-apple-ios
          rustup target list --installed

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 安装 Flutter 依赖
        working-directory: flutter_legado
        run: flutter pub get

      # 设备静态库只使用 iphoneos SDK，最低系统版本与 App 的 15.0 对齐。
      - name: 构建设备 Rust 静态库
        working-directory: rust
        run: |
          set -euo pipefail
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          # 显式固定最低版本，避免 Apple SDK 默认目标高于 App，导致链接版本不匹配。
          export IPHONEOS_DEPLOYMENT_TARGET=15.0
          cargo rustc --release --target aarch64-apple-ios -p legado-ffi --lib --crate-type staticlib --features quickjs
          mkdir -p ../flutter_legado/ios/RustFFI
          cp target/aarch64-apple-ios/release/liblegado_ffi.a \
             ../flutter_legado/ios/RustFFI/libliblegado_ffi.a

      - name: 安装设备 CocoaPods 依赖
        working-directory: flutter_legado/ios
        run: |
          pod install --repo-update

      - name: 构建设备应用（未签名）
        working-directory: flutter_legado
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --verbose 2>&1 | tee ios_device_build.log

      # FRB 运行时需要从设备二进制查找分发器；缺符号必须阻止交付。
      - name: 校验设备 PDE 符号
        run: |
          set -euo pipefail
          BIN=flutter_legado/build/ios/iphoneos/Runner.app/Runner
          COUNT=$(nm -g "$BIN" 2>/dev/null | grep -c "frb_pde_ffi_dispatcher_primary" || true)
          echo "设备 PDE 符号数：$COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::设备二进制缺少 FRB PDE 分发器符号"
            exit 1
          fi

      # 检查源码引用的图标文件和资产编译警告，不宣称换图标运行时已可用。
      - name: 校验图标资产引用文件
        run: |
          set -euo pipefail
          cd flutter_legado/ios/Runner/Assets.xcassets
          FAIL=0
          for D in launcher1.appiconset launcher2.appiconset launcher3.appiconset launcher4.appiconset launcher5.appiconset launcher6.appiconset; do
            for F in $(sed -n 's/.*"filename": *"\([^"]*\)".*/\1/p' "$D/Contents.json"); do
              [ -f "$D/$F" ] || { echo "::error::$D 引用了不存在的文件 $F"; FAIL=1; }
            done
          done
          [ "$FAIL" -eq 0 ] || exit 1

      - name: 校验图标资产编译警告
        run: |
          set -euo pipefail
          LOG=flutter_legado/ios_device_build.log
          if grep -q "unassigned children" "$LOG"; then
            echo "::error::actool 报告 appiconset 存在未分配槽位图像——图标资产没有完整编入产物"
            grep -n "unassigned children" "$LOG" | head -10
            exit 1
          fi
          echo "actool 无 unassigned children 警告（appiconset 槽位结构合法）"

      # 保留历史交付包的散文件注入和纯 legacy 转换，避免拆分时改变包形状。
      # 这些尝试未解决当时用户设备的 -54；收口证据见
      # docs/IOS_ICON_SWITCH_LIMITATION_20260903.md，后续独立对照验证后再清理。
      - name: 保留设备图标散文件兼容处理
        run: |
          set -euo pipefail
          APP=flutter_legado/build/ios/iphoneos/Runner.app
          ASSETS=flutter_legado/ios/Runner/Assets.xcassets
          # 显式复制四种 legacy 尺寸，保证各 SDK 构建的资源完整。
          for N in 1 2 3 4 5 6; do
            cp "$ASSETS/launcher${N}.appiconset/launcher${N}_120.png" "$APP/launcher${N}60x60@2x.png"
            cp "$ASSETS/launcher${N}.appiconset/launcher${N}_76.png"  "$APP/launcher${N}76x76@1x.png"
            cp "$ASSETS/launcher${N}.appiconset/launcher${N}_152.png" "$APP/launcher${N}76x76@2x.png"
            cp "$ASSETS/launcher${N}.appiconset/launcher${N}_180.png" "$APP/launcher${N}60x60@3x.png"
          done
          # 主图标 60x60 @3x（bundle 根原只有 AppIcon60x60@2x.png）
          cp "$ASSETS/AppIcon.appiconset/Icon-App-60x60@3x.png" "$APP/AppIcon60x60@3x.png"
          echo "== 注入后 bundle 根散文件 =="
          ls -l "$APP"/launcher*{60x60,76x76}*.png "$APP"/AppIcon*.png

      - name: 保留设备图标 legacy 声明处理
        run: |
          set -euo pipefail
          APP=flutter_legado/build/ios/iphoneos/Runner.app
          # 门禁：打包前 24 个指定散文件必须全部存在（纯 legacy 路径前提）
          for N in 1 2 3 4 5 6; do
            for B in "launcher${N}60x60@2x" "launcher${N}60x60@3x" "launcher${N}76x76@1x" "launcher${N}76x76@2x"; do
              [ -f "$APP/$B.png" ] || { echo "::error::missing $B.png (legacy 散文件不齐)"; exit 1; }
            done
          done
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib, sys
          p = sys.argv[1]
          with open(p, "rb") as f:
              d = plistlib.load(f)
          stripped = 0
          for section in ("CFBundleIcons", "CFBundleIcons~ipad"):
              icons = d.get(section)
              if not isinstance(icons, dict):
                  continue
              alt = icons.get("CFBundleAlternateIcons")
              if not isinstance(alt, dict):
                  continue
              for name, entry in alt.items():
                  if isinstance(entry, dict) and "CFBundleIconName" in entry:
                      del entry["CFBundleIconName"]
                      # 移除资产目录引用后，显式指向前一步复制的 legacy 散文件。
                      size = "76x76" if section == "CFBundleIcons~ipad" else "60x60"
                      entry["CFBundleIconFiles"] = [f"{name}{size}"]
                      stripped += 1
          with open(p, "wb") as f:
              plistlib.dump(d, f)
          print(f"stripped CFBundleIconName from {stripped} alternate entries (expected 12)")
          assert stripped >= 6, f"expected at least 6 (primary section), got {stripped}"
          if stripped != 12:
              print(f"::warning::expected 12 (6 alternates x 2 sections), got {stripped}")
          PY

      - name: 校验最终图标声明及资源
        run: |
          set -euo pipefail
          python3 - flutter_legado/build/ios/iphoneos/Runner.app <<'PY'
          import pathlib, plistlib, sys
          app = pathlib.Path(sys.argv[1])
          with (app / "Info.plist").open("rb") as file:
              data = plistlib.load(file)
          expected = {f"launcher{index}" for index in range(1, 7)}
          for section in ("CFBundleIcons", "CFBundleIcons~ipad"):
              icons = data.get(section)
              if section == "CFBundleIcons~ipad" and icons is None:
                  continue
              assert isinstance(icons, dict), f"缺少图标声明：{section}"
              alternates = icons.get("CFBundleAlternateIcons")
              assert isinstance(alternates, dict) and set(alternates) == expected, f"备选图标声明不完整：{section}"
              for name, entry in alternates.items():
                  assert isinstance(entry, dict) and "CFBundleIconName" not in entry, f"legacy 转换未完成：{section}/{name}"
                  files = entry.get("CFBundleIconFiles")
                  assert isinstance(files, list) and files, f"缺少图标文件引用：{section}/{name}"
                  for filename in files:
                      assert isinstance(filename, str) and filename, f"图标文件引用无效：{name}"
                      base = filename.removesuffix(".png")
                      suffixes = (".png", "@2x.png", "@3x.png", "~ipad.png", "@2x~ipad.png", "@3x~ipad.png")
                      assert any((app / (base + suffix)).is_file() for suffix in suffixes), f"图标资源缺失：{section}/{name}/{filename}"
          print("最终 plist 可解析，六个备选图标及引用资源完整；运行时能力仍须真机验证")
          PY

      # 直接重签最终修改版 Runner.app，保持图标兼容处理的交付结果。
      # 不使用重新 archive 的 flutter build ipa，以免覆盖上述包内修改。
      - name: 准备设备签名材料
        if: env.IOS_P12_BASE64 != ''
        working-directory: flutter_legado
        run: |
          set -euo pipefail
          WORK=build/ios/signing
          mkdir -p "$WORK"
          KEYCHAIN="$HOME/Library/Keychains/legado_ci.keychain"
          # 此步不启用 shell 跟踪，避免随机 keychain 密码写入日志。
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          # 1) P12 → 临时 keychain（并挂进 user keychain 搜索链，供 codesign 发现）
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          printf '%s' "$IOS_P12_BASE64" | base64 -d > "$WORK/legado_ci.p12"
          security import "$WORK/legado_ci.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          DEFAULT_KEYCHAIN="$(security default-keychain | awk '{print $3}')"
          security list-keychains -d user -s "$KEYCHAIN" "$DEFAULT_KEYCHAIN"
          # 2) 安装 mobileprovision 到系统目录 + 解码取 UUID / TeamID / app-identifier
          #    （entitlements 的 application-identifier 直接取自 profile 自身 → 自洽，
          #      无需单独维护 TEAM_ID secret；profile 与 bundle id 不匹配时此处即暴露）
          printf '%s' "$IOS_PROFILE_BASE64" | base64 -d > "$WORK/legado_ci.mobileprovision"
          security cms -D -i "$WORK/legado_ci.mobileprovision" > "$WORK/profile.plist"
          PROFILE_UUID="$(plutil -extract UUID raw "$WORK/profile.plist")"
          TEAM_ID="$(plutil -extract TeamIdentifier raw "$WORK/profile.plist")"
          APP_IDENTIFIER="$(plutil -extract Entitlements.application-identifier raw "$WORK/profile.plist")"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp "$WORK/legado_ci.mobileprovision" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"
          # 3) 定位 P12 中的签名身份（证书类型须与 IOS_EXPORT_METHOD 匹配：
          #    ad-hoc→Apple Distribution；development→Apple Development，
          #    见 docs/IOS_CI_SIGNING_SETUP.md）
          METHOD="${IOS_EXPORT_METHOD:-ad-hoc}"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 -oE '"[^"]+"' | tr -d '"' || true)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::P12 中无有效 codesigning 身份（export-method=$METHOD）；核对证书类型与密码，见 docs/IOS_CI_SIGNING_SETUP.md 排障小节"
            exit 1
          fi
          echo "identity: $IDENTITY"
          echo "team: $TEAM_ID / app-identifier: $APP_IDENTIFIER / method: $METHOD"
          # 4) 为待签名 app 预埋 embedded.mobileprovision + 签名 entitlements
          APP=build/ios/iphoneos/Runner.app
          cp "$WORK/legado_ci.mobileprovision" "$APP/embedded.mobileprovision"
          # 注：不用 heredoc——YAML 块标量内 heredoc 体无法缩进（terminator 须顶格），
          # 会破坏 yml 解析；改用 echo 组生成
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '  <key>application-identifier</key>'
            echo "  <string>$APP_IDENTIFIER</string>"
            echo '  <key>keychain-access-groups</key>'
            echo '  <array>'
            echo "    <string>$APP_IDENTIFIER</string>"
            echo '  </array>'
            echo '</dict>'
            echo '</plist>'
          } > "$WORK/SigningEntitlements.plist"

      - name: 签名最终设备应用
        if: env.IOS_P12_BASE64 != ''
        working-directory: flutter_legado
        run: |
          set -euo pipefail
          WORK=build/ios/signing
          KEYCHAIN="$HOME/Library/Keychains/legado_ci.keychain"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 -oE '"[^"]+"' | tr -d '"')"
          [ -n "$IDENTITY" ] || { echo "::error::找不到 codesigning 身份"; exit 1; }
          APP=build/ios/iphoneos/Runner.app
          # 先嵌套代码对象（Flutter.framework 等），后顶层 bundle；
          # 不加 --options runtime（开发/Ad-hoc 侧载无需 hardened runtime，
          # 该选项是公证/distribution 上架路径才需要的）。
          # 不用 cd——cd 后 WORK/APP 相对路径会失效，全部用绝对化工作目录内相对路径
          for F in "$APP"/Frameworks/*.framework; do
            [ -d "$F" ] || continue
            codesign -f -s "$IDENTITY" "$F"
          done
          codesign -f -s "$IDENTITY" --entitlements "$WORK/SigningEntitlements.plist" "$APP"
          codesign -v --strict --verbose=2 "$APP"
          echo "signed Runner.app with: $IDENTITY"

      - name: 打包并校验设备 IPA
        id: package
        working-directory: flutter_legado/build/ios/iphoneos
        run: |
          set -euo pipefail
          if [ -n "$IOS_P12_BASE64" ]; then
            IPA_NAME=app-signed.ipa
            ARTIFACT_NAME=legado-ios-signed-ipa
          else
            IPA_NAME=app-unsigned.ipa
            ARTIFACT_NAME=legado-ios-unsigned-ipa
          fi
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qry "$IPA_NAME" Payload
          unzip -tq "$IPA_NAME"
          python3 - "$IPA_NAME" <<'PY'
          import plistlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              plistlib.loads(archive.read("Payload/Runner.app/Info.plist"))
              assert archive.getinfo("Payload/Runner.app/Runner").file_size > 0, "IPA 中缺少有效 Runner 二进制"
          PY
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_path=flutter_legado/build/ios/iphoneos/$IPA_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA_NAME"

      - name: 上传设备 IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.ipa_path }}
          retention-days: 14
          if-no-files-found: error

      - name: 说明未签名产物
        if: env.IOS_P12_BASE64 == ''
        run: echo "::warning::未配置签名证书，产出未签名 IPA；配置方法见 docs/IOS_CI_SIGNING_SETUP.md"

      - name: 上传设备构建失败日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-device-build-log
          path: flutter_legado/ios_device_build.log
          retention-days: 7
          if-no-files-found: ignore

      # car 名称扫描和大小阈值是历史启发式探针，仅显式手动诊断时运行。
      # 诊断失败不能替代上述资源、PDE、签名和 IPA 的硬校验。
      - name: 诊断图标 car 名称与大小
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        continue-on-error: true
        run: |
          set -euo pipefail
          CAR=flutter_legado/build/ios/iphoneos/Runner.app/Assets.car
          ls -lh "$CAR"
          STR_ASCII=$(strings "$CAR" 2>/dev/null || true)
          STR_UTF16=$(strings -el "$CAR" 2>/dev/null || true)
          probe() { case "$STR_ASCII" in *"$1"*) return 0 ;; esac; case "$STR_UTF16" in *"$1"*) return 0 ;; esac; return 1; }
          if probe "AppIcon"; then
            echo "car 名称表可 grep（ASCII/UTF-16）——严格校验 6 个 appiconset 名"
            FOUND=0
            for I in 1 2 3 4 5 6; do
              N="launcher${I}"
              if probe "$N"; then FOUND=$((FOUND+1)); else echo "missing: $N"; fi
            done
            echo "appiconsets found in Assets.car: $FOUND/6"
            [ "$FOUND" -eq 6 ] || { echo "::warning::Assets.car 缺少变体图标 appiconset"; exit 1; }
          else
            echo "AppIcon 名两种编码均不可 grep——car 名称表存储方式不同，回退尺寸门禁"
            SIZE=$(wc -c < "$CAR")
            [ "$SIZE" -ge 400000 ] || { echo "::warning::Assets.car 仅 ${SIZE} 字节（全目录应 >500KB）——变体图标 appiconset 未编入"; exit 1; }
            echo "尺寸门禁通过: $SIZE 字节（此分支静态校验降级，最终权威 = 真机验收）"
          fi

      - name: 上传图标 car 诊断产物
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-device-assets-car
          path: flutter_legado/build/ios/iphoneos/Runner.app/Assets.car
          retention-days: 7
          if-no-files-found: ignore

      - name: 导出设备 plist 诊断产物
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        continue-on-error: true
        run: |
          set -euo pipefail
          PL=flutter_legado/build/ios/iphoneos/Runner.app/Info.plist
          OUT=flutter_legado/build/ios/device-plist
          mkdir -p "$OUT"
          cp "$PL" "$OUT/Info.plist"
          python3 -c 'import plistlib,json,sys; d=plistlib.load(open(sys.argv[1],"rb")); print(json.dumps({k:v for k,v in d.items() if "Icon" in k}, indent=2))' "$PL" > "$OUT/icon-section.json"

      - name: 上传设备 plist 诊断产物
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.diagnostics }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-device-info-plist
          path: flutter_legado/build/ios/device-plist/
          retention-days: 7
          if-no-files-found: ignore
