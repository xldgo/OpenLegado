name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Determine change scope
        id: changes
        uses: ./.github/actions/ci-changes

      - name: Setup Flutter and Rust
        if: steps.changes.outputs.flutter == 'true' || steps.changes.outputs.dart_generate == 'true' || steps.changes.outputs.bridge_generate == 'true'
        uses: ./.github/actions/setup-flutter-rust

      - name: Run flutter pub get
        if: steps.changes.outputs.flutter == 'true' || steps.changes.outputs.dart_generate == 'true' || steps.changes.outputs.bridge_generate == 'true'
        working-directory: flutter_legado
        run: flutter pub get --enforce-lockfile

      - name: Check architecture dependencies
        if: steps.changes.outputs.flutter == 'true'
        working-directory: flutter_legado
        run: dart run tool/check_architecture.dart

      - name: Check Dart generated code
        if: steps.changes.outputs.dart_generate == 'true'
        run: python3 scripts/dev.py generate dart --check

      - name: Setup bridge generators
        if: steps.changes.outputs.bridge_generate == 'true'
        shell: bash
        run: |
          FRB_VERSION="$(python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from tooling.contracts import runtime_version; print(runtime_version(Path.cwd()))')"
          cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked
          cargo install cargo-expand --version 1.0.127 --locked

      - name: Check bridge generated code
        if: steps.changes.outputs.bridge_generate == 'true'
        run: python3 scripts/dev.py generate bridge --check

      - name: Run flutter analyze
        if: steps.changes.outputs.flutter == 'true'
        working-directory: flutter_legado
        run: flutter analyze --no-pub

      - name: Run flutter test
        if: steps.changes.outputs.flutter == 'true'
        working-directory: flutter_legado
        run: |
          cargo build --locked --manifest-path ../rust/Cargo.toml -p legado-ffi --features quickjs
          flutter test --no-pub
