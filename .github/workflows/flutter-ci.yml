name: Flutter CI
on:
  workflow_dispatch:
  push:
    paths: ['flutter_legado/**', 'rust/**', '.github/workflows/flutter-ci.yml']
  pull_request:
    paths: ['flutter_legado/**', 'rust/**', '.github/workflows/flutter-ci.yml']

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - name: Flutter pub get
        working-directory: flutter_legado
        run: flutter pub get
      - name: Flutter analyze
        working-directory: flutter_legado
        run: flutter analyze --no-fatal-infos
      - name: Flutter test
        working-directory: flutter_legado
        run: flutter test
