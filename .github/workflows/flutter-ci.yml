name: Flutter CI
on:
  workflow_dispatch:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: 判定改动范围
        id: changes
        uses: ./.github/actions/ci-changes
      - uses: subosito/flutter-action@v2
        if: steps.changes.outputs.flutter == 'true'
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Flutter pub get
        if: steps.changes.outputs.flutter == 'true'
        working-directory: flutter_legado
        run: flutter pub get
      - name: Flutter analyze
        if: steps.changes.outputs.flutter == 'true'
        working-directory: flutter_legado
        run: flutter analyze --no-fatal-infos
      - name: Flutter test
        if: steps.changes.outputs.flutter == 'true'
        working-directory: flutter_legado
        run: flutter test
