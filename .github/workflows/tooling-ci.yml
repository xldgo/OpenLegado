name: Tooling CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tooling-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Determine change scope
        id: changes
        uses: ./.github/actions/ci-changes

      - name: Verify CI orchestration rules
        if: steps.changes.outputs.tooling == 'true'
        run: python3 -m unittest discover -s .github/scripts -p test_ci_changes.py -v

      - name: Verify Python tooling and platform isolation
        if: steps.changes.outputs.tooling == 'true'
        run: python3 scripts/dev.py test tooling

      - name: Lint workflow syntax
        if: steps.changes.outputs.tooling == 'true'
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -shellcheck= -pyflakes=
