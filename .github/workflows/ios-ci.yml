name: iOS CI

# 模拟器验证按需运行，不作为所有 PR 的必需检查。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # 与设备构建使用同一版本的 Xcode。
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Xcode and simulator SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Setup Flutter and Rust
        uses: ./.github/actions/setup-flutter-rust
        with:
          rust-targets: aarch64-apple-ios-sim
          rust-components: llvm-tools-preview

      # 在工作区内补装目标，确保使用 rust-toolchain.toml 锁定的工具链。
      - name: Verify workspace simulator target
        working-directory: rust
        run: |
          rustup target add aarch64-apple-ios-sim
          rustup component add llvm-tools-preview
          rustup target list --installed

      - name: Install Flutter dependencies
        working-directory: flutter_legado
        run: flutter pub get --enforce-lockfile

      - name: Build simulator Rust static library
        run: python3 scripts/dev.py build ffi ios --target simulator --profile release

      - name: Install simulator CocoaPods dependencies
        working-directory: flutter_legado/ios
        run: pod install --repo-update

      - name: Build simulator application
        working-directory: flutter_legado
        run: |
          set -euo pipefail
          flutter build ios --simulator --debug 2>&1 | tee ios_simulator_build.log

      # Debug 主体可能位于 Runner.debug.dylib，不能只检查 Runner 加载桩。
      - name: Verify simulator PDE symbols
        run: python3 scripts/dev.py verify app ios --target simulator --profile release --app flutter_legado/build/ios/iphonesimulator/Runner.app --cargo-target-dir rust/target

      - name: Select and boot test simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for group in devices.values() for device in group if device.get("isAvailable") and device["name"].startswith("iPhone")))')
          # 测试前保存设备标识，失败路径也能收集同一模拟器的日志。
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # 校验通道接线和已安装声明；真实切图标仍是测试内的非断言取证。
      - name: Run icon state integration tests
        working-directory: flutter_legado
        run: |
          set -euo pipefail
          flutter test integration_test/launcher_icon_ios_test.dart -d "$UDID" 2>&1 | tee ios_launcher_icon_test.log

      # 搜索、进书和翻章走本地回环书源，保持原测试断言，失败必须使作业变红。
      - name: Run offline search and reading tests
        working-directory: flutter_legado
        run: |
          set -euo pipefail
          flutter test integration_test/e2e_search_read_ios_test.dart -d "$UDID" 2>&1 | tee ios_search_read_test.log

      # Flutter 集成测试会覆写 Runner.app；不将测试宿主重新启动当作生产首屏验收。
      - name: Collect simulator test evidence
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p ios-ci-evidence
          git rev-parse HEAD > ios-ci-evidence/commit.txt
          if [ -n "${UDID:-}" ]; then
            xcrun simctl spawn "$UDID" log show --last 10m \
              --predicate 'processImagePath CONTAINS "Runner"' \
              > ios-ci-evidence/sim_runner.log || true
            grep -iE "fatal|crash|rust|panicked" ios-ci-evidence/sim_runner.log \
              | head -40 > ios-ci-evidence/sim_errors.log || true
          fi

      - name: Upload simulator test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-ci-evidence
          path: |
            ios-ci-evidence/
            flutter_legado/ios_simulator_build.log
            flutter_legado/ios_launcher_icon_test.log
            flutter_legado/ios_search_read_test.log
            flutter_legado/build/ios/iphonesimulator/Runner.app/
          retention-days: 2
          if-no-files-found: warn
