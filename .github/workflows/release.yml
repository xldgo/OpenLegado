name: Application Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows desktop release package'
        type: boolean
        default: true
      build_android:
        description: 'Build Android APK release package'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.event_name }}-${{ github.ref }}
  # 手动构建可取消旧任务，标签发布保持完整上传。
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build-android:
    if: ${{ github.event_name == 'push' || inputs.build_android != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload-apk.outputs.artifact-id }}
    env:
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter and Rust
        uses: ./.github/actions/setup-flutter-rust
        with:
          rust-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Java with Gradle cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: 'gradle'

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/android_signing.py

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build and verify Android release FFI
        run: python3 scripts/dev.py build ffi android --profile release --abis arm64-v8a,armeabi-v7a,x86_64

      - name: Run flutter pub get
        working-directory: flutter_legado
        run: flutter pub get

      - name: Build release APKs
        working-directory: flutter_legado
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64

      - name: Verify release APK signatures and Rust libraries
        run: >-
          python3 scripts/dev.py collect apk android --profile release
          --abis arm64-v8a,armeabi-v7a,x86_64 --output-dir release-apk --cargo-target-dir rust/target
          --signing-cert-sha256 "$ANDROID_SIGNING_CERT_SHA256"

      - name: Upload release APK artifacts
        id: upload-apk
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-apk/*-release.apk
          if-no-files-found: error
          retention-days: 2

      - name: Clean temporary signing key
        if: always()
        run: python3 .github/scripts/android_signing.py --clean

  build-windows:
    if: ${{ github.event_name == 'push' || inputs.build_windows != false }}
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload-windows.outputs.artifact-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter and Rust
        uses: ./.github/actions/setup-flutter-rust

      - name: Run flutter pub get
        working-directory: flutter_legado
        run: flutter pub get

      - name: Build Windows release package
        run: python scripts/dev.py build windows --profile release

      - name: Archive Windows release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null
          $bundleDir = "flutter_legado/build/windows/x64/runner/Release"
          Compress-Archive -Path "$bundleDir/*" -DestinationPath "release-windows/legado-windows-x64.zip" -Force
          Write-Host "Windows release archive generated successfully."

      - name: Upload Windows release artifacts
        id: upload-windows
        uses: actions/upload-artifact@v7
        with:
          name: windows-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-windows/legado-windows-x64.zip
          if-no-files-found: error
          retention-days: 2

  publish:
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && (needs.build-android.result == 'success' || needs.build-windows.result == 'success') }}
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets directory
        run: |
          mkdir -p release-dist
          if ls release-assets/*-release.apk 1> /dev/null 2>&1; then
            cp release-assets/*-release.apk release-dist/
          fi
          if ls release-assets/*.zip 1> /dev/null 2>&1; then
            cp release-assets/*.zip release-dist/
          fi
          echo "Files to publish:"
          ls -lh release-dist/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || 'Alpha Build (Rolling)' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'alpha' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          draft: false
          body: |
            ${{ startsWith(github.ref, 'refs/tags/v') && format('Release version {0}', github.ref_name) || '### OpenLegado Rolling Alpha Build' }}
            
            - **Commit**: ${{ github.sha }}
            - **Build Date**: ${{ github.event.head_commit.timestamp || github.run_id }}
            - **Workflow**: [${{ github.workflow }} #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: release-dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
