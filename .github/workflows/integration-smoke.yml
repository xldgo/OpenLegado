# Flutter↔Rust 端到端集成冒烟测试
# 构建真实 Rust DLL → Flutter 侧经 FFI 调用往返验证
name: Integration Smoke

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      platform:
        description: '选择 Android FFI 或 Windows FFI；编排规则改由 Tooling CI 手动验证'
        type: choice
        default: all
        options: [all, android, windows]

permissions:
  contents: read

concurrency:
  group: integration-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android_ffi: ${{ steps.changes.outputs.android_ffi }}
      windows_ffi: ${{ steps.changes.outputs.windows_ffi }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Determine change scope
        id: changes
        uses: ./.github/actions/ci-changes

  android-ffi:
    needs: changes
    if: needs.changes.outputs.android_ffi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-flutter-rust
        with:
          flutter-version: 'none'
          rust-targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build and verify Android debug FFI
        run: python3 scripts/dev.py build ffi android --profile debug --abis arm64-v8a,x86_64

  ffi-smoke:
    needs: changes
    if: needs.changes.outputs.windows_ffi == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Flutter and Rust
        uses: ./.github/actions/setup-flutter-rust

      - name: Build and verify legado-ffi DLL (quickjs)
        run: python scripts/dev.py build ffi windows --profile debug

      - name: Run flutter pub get
        working-directory: flutter_legado
        run: flutter pub get

      # ── 运行 FFI 冒烟（仅 ffi_smoke；不含需外网书源的 e2e_search_read）──
      # DLL 搜索路径：cwd/../rust/target/debug/legado_ffi.dll（由 RustApi._resolveFfiLibrary 自动发现）
      - name: Run FFI integration smoke test
        working-directory: flutter_legado
        run: flutter test integration_test/ffi_smoke_test.dart -d windows

  check:
    if: ${{ always() }}
    needs: [changes, android-ffi, ffi-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Aggregate integration smoke check results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_changes.py check android-ffi=android_ffi ffi-smoke=windows_ffi
