# Flutter↔Rust 端到端集成冒烟测试
# 构建真实 Rust DLL → Flutter 侧经 FFI 调用往返验证
name: Integration Smoke
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      platform:
        description: '选择 Android FFI、Windows FFI，或仅验证编排规则'
        type: choice
        default: all
        options: [all, android, windows, routing]

permissions:
  contents: read

concurrency:
  group: integration-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android_ffi: ${{ steps.changes.outputs.android_ffi }}
      windows_ffi: ${{ steps.changes.outputs.windows_ffi }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/ci-changes

  android-ffi:
    needs: changes
    if: needs.changes.outputs.android_ffi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: 安装 Android NDK
        run: |
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: 构建并校验 Android debug FFI（Python 统一入口）
        run: python3 scripts/dev.py build ffi android --profile debug --abis arm64-v8a,x86_64

  ffi-smoke:
    needs: changes
    if: needs.changes.outputs.windows_ffi == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # ── Rust 工具链 ──
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # ── Flutter 工具链 ──
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      # ── 构建 Rust FFI 动态库（带 quickjs feature）──
      - name: 构建并校验 legado-ffi DLL (quickjs)
        run: python scripts/dev.py build ffi windows --profile debug

      # ── Flutter 依赖 ──
      - name: Flutter pub get
        working-directory: flutter_legado
        run: flutter pub get

      # ── 运行 FFI 冒烟（仅 ffi_smoke；不含需外网书源的 e2e_search_read）──
      # DLL 搜索路径：cwd/../rust/target/debug/legado_ffi.dll（由 RustApi._resolveFfiLibrary 自动发现）
      - name: 运行 FFI 集成冒烟测试
        working-directory: flutter_legado
        run: flutter test integration_test/ffi_smoke_test.dart -d windows

  check:
    if: ${{ always() }}
    needs: [changes, android-ffi, ffi-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 汇总原生冒烟门禁
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_changes.py check android-ffi=android_ffi ffi-smoke=windows_ffi
