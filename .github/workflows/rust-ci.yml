name: Rust CI
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: changes
        uses: ./.github/actions/ci-changes

  quality:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Cargo fmt check
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Cargo clippy (default features)
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Cargo clippy (quickjs — 体检§三.10 门控代码此前从未 lint)
        working-directory: rust
        run: cargo clippy -p legado-js -p legado-ffi -p legado-server --features quickjs --all-targets -- -D warnings

  tests:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Cargo test
        working-directory: rust
        run: cargo test --workspace
      # 保留 QuickJS 全量回归，不跳过沙箱 OOM 用例。
      - name: Cargo test (quickjs)
        working-directory: rust
        run: cargo test -p legado-js --features quickjs
      - name: Cargo test legado-ffi full (quickjs)
        working-directory: rust
        run: cargo test -p legado-ffi --features quickjs
      - name: Cargo test legado-server (quickjs)
        working-directory: rust
        run: cargo test -p legado-server --features quickjs

  audit:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Cargo audit (RustSec advisories)
        working-directory: rust
        run: cargo audit

  # 保留原 check 名；只允许判定为无关的任务跳过。
  check:
    if: ${{ always() }}
    needs: [changes, quality, tests, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 汇总 Rust 门禁
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_changes.py check quality=rust tests=rust audit=rust
