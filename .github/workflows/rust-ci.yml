name: Rust CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Determine change scope
        id: changes
        uses: ./.github/actions/ci-changes

  quality:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-flutter-rust
        with:
          flutter-version: 'none'
          rust-components: rustfmt,clippy

      - name: Run cargo fmt check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Run cargo clippy (default features)
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run cargo clippy (quickjs features)
        working-directory: rust
        run: cargo clippy -p legado-js -p legado-ffi -p legado-server --features quickjs --all-targets -- -D warnings

  tests:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-flutter-rust
        with:
          flutter-version: 'none'

      - name: Run cargo test
        working-directory: rust
        run: cargo test --workspace

      # 保留 QuickJS 全量回归，不跳过沙箱 OOM 用例。
      - name: Run cargo test (quickjs)
        working-directory: rust
        run: cargo test -p legado-js --features quickjs

      - name: Run cargo test legado-ffi full (quickjs)
        working-directory: rust
        run: cargo test -p legado-ffi --features quickjs

      - name: Run cargo test legado-server (quickjs)
        working-directory: rust
        run: cargo test -p legado-server --features quickjs

  audit:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-flutter-rust
        with:
          flutter-version: 'none'
          rust-cache: 'false'

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit (RustSec advisories)
        working-directory: rust
        run: cargo audit

  # 保留原 check 名；只允许判定为无关的任务跳过。
  check:
    if: ${{ always() }}
    needs: [changes, quality, tests, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Aggregate Rust check results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_changes.py check quality=rust tests=rust audit=rust
