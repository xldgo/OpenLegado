# 仅清理长期无更新的 Issue，PR 和已确认、处理中的问题保持开放。
name: Stale Issues

on:
  schedule:
    # 每月 1、6、11、16、21、26、31 日北京时间 9:30 运行。
    - cron: '30 1 1/5 * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write

    steps:
      - name: Close stale issues
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: '由于长期没有状态更新，该问题将于5天后自动关闭。如有需要可重新打开。'
          days-before-stale: 30
          days-before-close: 5
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-issue-labels: 'confirmed,in-progress'
          operations-per-run: 100
